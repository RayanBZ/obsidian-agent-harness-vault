[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-vault"
version = "0.1.0"
description = "Local Obsidian + Claude Code multi-agent harness MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
]
authors = [{ name = "Agent Vault MVP" }]

[project.scripts]
agent-vault = "agent_vault.cli:main"

[tool.setuptools]
packages = ["agent_vault"]
